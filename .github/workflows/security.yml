name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # jeden Montag 06:00 UTC, faengt neu bekannt gewordene CVEs in
    # unveraenderten Dependencies ab
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: github/codeql-action/init@v3
        with:
          languages: go

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
